<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-label="Pressed bales of cotton lint stacked in the warehouse">
  <!-- floor -->
  <path d="M0 306 L480 306 L480 360 L0 360 Z" fill="#e3eee5"/>
  <line x1="0" y1="306" x2="480" y2="306" stroke="#c3ddcc" stroke-width="2"/>

  <!-- back bale, paler -->
  <g opacity=".5">
    <rect x="60" y="128" width="150" height="80" rx="5" fill="#f7f1e2" stroke="#a98548" stroke-width="2.5"/>
    <g stroke="#c69a4c" stroke-width="2">
      <line x1="98" y1="128" x2="98" y2="208"/>
      <line x1="172" y1="128" x2="172" y2="208"/>
    </g>
  </g>

  <!-- lower pair -->
  <g fill="#f7f1e2" stroke="#a98548" stroke-width="2.5">
    <rect x="86" y="208" width="164" height="98" rx="6"/>
    <rect x="250" y="208" width="164" height="98" rx="6"/>
  </g>
  <g stroke="#c69a4c" stroke-width="2.2">
    <line x1="128" y1="208" x2="128" y2="306"/>
    <line x1="208" y1="208" x2="208" y2="306"/>
    <line x1="292" y1="208" x2="292" y2="306"/>
    <line x1="372" y1="208" x2="372" y2="306"/>
  </g>

  <!-- top bale, set back a little -->
  <rect x="168" y="112" width="164" height="96" rx="6" fill="#fbf7ec" stroke="#a98548" stroke-width="2.5"/>
  <g stroke="#c69a4c" stroke-width="2.2">
    <line x1="210" y1="112" x2="210" y2="208"/>
    <line x1="290" y1="112" x2="290" y2="208"/>
  </g>

  <!-- lot plate on the top bale -->
  <rect x="226" y="140" width="48" height="34" rx="4" fill="#ffffff" stroke="#2f8a61" stroke-width="2"/>
  <g stroke="#2f8a61" stroke-width="2" stroke-linecap="round">
    <line x1="236" y1="152" x2="264" y2="152"/>
    <line x1="236" y1="160" x2="258" y2="160"/>
  </g>

  <!-- lint texture peeking from the wrap -->
  <g fill="#fbfaf5" stroke="#e7e4d8" stroke-width="1.4">
    <circle cx="106" cy="228" r="6"/>
    <circle cx="118" cy="234" r="4.5"/>
    <circle cx="396" cy="230" r="6"/>
    <circle cx="384" cy="236" r="4.5"/>
  </g>

  <!-- pallet -->
  <g stroke="#a9cdb6" stroke-width="3" stroke-linecap="round">
    <line x1="86" y1="312" x2="414" y2="312"/>
    <line x1="112" y1="312" x2="112" y2="322"/>
    <line x1="250" y1="312" x2="250" y2="322"/>
    <line x1="388" y1="312" x2="388" y2="322"/>
  </g>
</svg>
